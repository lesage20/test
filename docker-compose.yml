# =============================================================================
# SageCoders Laravel — docker-compose (dev + prod unifié)
# Usage:
#   docker compose up -d          # start
#   docker compose down           # stop
#   docker compose logs -f app    # tail app logs
#   docker compose exec app bash  # shell in container
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagecoders/test-app:latest
    container_name: test-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://test.sagecoders.com
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-test}
      DB_USERNAME: ${DB_USERNAME:-test}
      DB_PASSWORD: ${DB_PASSWORD:-test}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    ports:
      # Host 3002 → container 8000 (php artisan serve)
      # Bind on 127.0.0.1 only — Caddy externe on host proxies to it
      - "127.0.0.1:3002:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Persist user uploads + storage outside container
      - test_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_DATABASE:-test}
      MYSQL_USER: ${DB_USERNAME:-test}
      MYSQL_PASSWORD: ${DB_PASSWORD:-test}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - test_mysql:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  test_storage:
  test_mysql:
